# Rebuilds apks/manifest.json and index.html whenever APK files change on main.
# Uploading or deleting a .apk in apks/ on github.com is enough; this workflow does the rest.
name: Refresh APK catalog

on:
  push:
    branches: [main]
    paths:
      - "apks/**"
      - "src/**"
      - "build.mjs"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The build uses only Node built-ins, so no npm install is needed.
      - name: Build catalog and site
        run: |
          node scripts/catalog.mjs
          node build.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apks/manifest.json index.html
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Refresh APK catalog [skip ci]"
            git push
          fi
